version: 2

project_name: bubbleMonitor

before:
  hooks:
    - go generate ./...

builds:
  - id: bubbleMonitor
    main: ./cmd/bub
    binary: bub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: binaries
    format: binary
  - id: archives
    formats:
      - tar.gz
      - zip
    wrap_in_directory: true
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: N1xev
    name: bubbleMonitor
  draft: false
  prerelease: auto
  name_template: '{{.Tag}}'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^refactor:'
