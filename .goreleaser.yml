version: 2

project_name: bubbleMonitor

before:
  hooks:
    - go generate ./...

builds:
  - id: bubbleMonitor-windows
    main: ./cmd/bub
    binary: bub.exe
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  - id: bubbleMonitor
    main: ./cmd/bub
    binary: bub
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goarm:
      - v6
      - v7
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: binaries
    format: binary
    builds:
      - bubbleMonitor-windows
      - bubbleMonitor
  - id: archives
    format: tar.gz
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        format: zip
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: N1xev
    name: bubbleMonitor
  draft: false
  prerelease: auto
  name_template: '{{.Tag}}'
  replacements:
    amd64: x86_64
    arm64: aarch64
    darwin: macOS
    linux: Linux
    windows: Windows

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^refactor:'
